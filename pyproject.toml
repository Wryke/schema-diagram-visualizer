[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemadiagram"
version = "0.1.0"
description = "Draw diagrams from SQL schema files"
requires-python = ">=3.12"
dependencies = ["graphviz"]

[project.scripts]
diagram = "schemadiagram.cli:main"

[tool.setuptools]
packages = ["schemadiagram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
